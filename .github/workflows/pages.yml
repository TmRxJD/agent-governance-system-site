name: github-pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Inventory (source)
        run: pnpm inventory
      - name: Build
        env:
          BASE_PATH: /agent-governance-system-site
          PUBLIC_APPWRITE_ENDPOINT: https://appwrite.athyen.pl/v1
          PUBLIC_APPWRITE_PROJECT_ID: 68190de700097b8f59df
          PUBLIC_AGS_COMMERCE_FUNCTION_ID: ags-commerce
          PUBLIC_AGS_PAYMENT_PROVIDER: stripe
          PUBLIC_SITE_ORIGIN: https://tmrxjd.github.io/agent-governance-system-site
        run: pnpm build
      - name: Inventory (build)
        run: pnpm inventory:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
